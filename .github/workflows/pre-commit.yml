---
name: pre-commit

on:  # yamllint disable-line rule:truthy
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-python@v7
            - uses: pre-commit/action@v2.0.0
        if: ${{ always() }}
